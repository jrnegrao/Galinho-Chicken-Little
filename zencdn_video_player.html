<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100%; height: 100vh; }
    .video-js { width: 100% !important; height: 100vh !important; }
  </style>
</head>
<body>

  <video-js
    id="meu-player"
    class="vjs-big-play-centered"
    controls
    autoplay
    muted
    preload="auto"
  ></video-js>

  <script>
    // Lê os parâmetros da URL
    const params = new URLSearchParams(window.location.search);
    const src    = params.get("src");
    const poster = params.get("poster");

    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://vjs.zencdn.net/8.6.1/video-js.css";
    document.head.appendChild(link);

    var script = document.createElement("script");
    script.src = "https://vjs.zencdn.net/8.6.1/video.min.js";
    script.onload = function () {
      var player = videojs("meu-player", {
        autoplay: true,
        muted: true,
        liveui: true,
        poster: poster || "",
      });

      if (src) {
        player.src({
          src: src,
          type: "application/x-mpegURL",
        });
      }
    };
    document.head.appendChild(script);
  </script>

</body>
</html>
